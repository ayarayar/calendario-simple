<!DOCTYPE html>
<html>
<head>
  <title>Calendario Simple</title>
  <style>
    body {
      font-family: Arial;
    }

    h1 {
      color: darkblue;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background-color: lightgray;
      padding: 10px;
    }

    td {
      padding: 10px;
      text-align: center;
    }

    td:hover {
      background-color: #d0f0ff;
    }

    .fin-de-semana {
      background-color: #ffe6e6;
    }

    table, th, td {
      border: 1px solid gray;
    }
  </style>
</head>
<body>

  <h1>Calendario Abril</h1>

  <table>
    <tr>
      <th>Lun</th>
      <th>Mar</th>
      <th>Mié</th>
      <th>Jue</th>
      <th>Vie</th>
      <th>Sáb</th>
      <th>Dom</th>
    </tr>
    <tr>
      <td></td><td>1</td><td>2</td><td>3</td><td>4</td><td class="fin-de-semana">5</td><td class="fin-de-semana">6</td>
    </tr>
    <tr>
      <td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td class="fin-de-semana">12</td><td class="fin-de-semana">13</td>
    </tr>
    <tr>
      <td>14</td><td>15</td><td>16</td><td>17</td><td>18</td><td class="fin-de-semana">19</td><td class="fin-de-semana">20</td>
    </tr>
    <tr>
      <td>21</td><td>22</td><td>23</td><td>24</td><td>25</td><td class="fin-de-semana">26</td><td class="fin-de-semana">27</td>
    </tr>
    <tr>
      <td>28</td><td>29</td><td>30</td><td></td><td></td><td></td><td></td>
    </tr>
  </table>

</body>
</html>
